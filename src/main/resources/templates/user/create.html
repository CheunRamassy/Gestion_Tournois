<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Gestion Tournois</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/user/create.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

    <style>
        :root {
            --gradient-gaming: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #00ff88;
            --text-light: #e0e0e0;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .signup-header {
            background: var(--gradient-gaming);
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .signup-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }

        .signup-header h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 2.5rem;
            color: white;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .signup-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }

        .signup-form {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }

        .form-input::placeholder {
            color: rgba(224, 224, 224, 0.5);
        }

        .form-select {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }

        .form-select option {
            background: #1a1a2e;
            color: var(--text-light);
        }

        .password-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: white;
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .checkbox-input {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .checkbox-input:checked {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .checkbox-input:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .checkbox-label {
            color: rgba(224, 224, 224, 0.8);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .checkbox-label a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .checkbox-label a:hover {
            color: white;
        }

        .signup-button {
            width: 100%;
            padding: 18px;
            background: var(--gradient-gaming);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .signup-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .signup-button:hover::before {
            left: 100%;
        }

        .signup-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .signup-button:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: rgba(224, 224, 224, 0.8);
            font-size: 0.95rem;
        }

        .login-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: white;
        }

        .form-error {
            color: #ff4757;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .form-success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        /* Styles pour les nouvelles sections */
        .form-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-subtitle {
            color: rgba(224, 224, 224, 0.7);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .game-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .game-card {
            position: relative;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .game-card:hover {
            border-color: var(--accent-color);
            background: rgba(0, 255, 136, 0.1);
        }

        .game-card.selected {
            border-color: var(--accent-color);
            background: rgba(0, 255, 136, 0.2);
        }

        .game-card input[type="checkbox"] {
            display: none;
        }

        .game-card label {
            display: block;
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            text-align: center;
        }

        .niveau-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .niveau-option {
            flex: 1;
            min-width: 150px;
            position: relative;
        }

        .niveau-option input[type="radio"] {
            display: none;
        }

        .niveau-option label {
            display: block;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
            color: var(--text-light);
            backdrop-filter: blur(10px);
        }

        .niveau-option label:hover {
            border-color: var(--accent-color);
            background: rgba(0, 255, 136, 0.1);
        }

        .niveau-option input[type="radio"]:checked + label {
            border-color: var(--accent-color);
            background: rgba(0, 255, 136, 0.2);
        }

        .niveau-description {
            font-size: 0.8rem;
            color: rgba(224, 224, 224, 0.6);
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .signup-container {
                margin: 10px;
            }

            .signup-header {
                padding: 30px 20px;
            }

            .signup-header h1 {
                font-size: 2rem;
            }

            .signup-form {
                padding: 30px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .niveau-options {
                flex-direction: column;
            }

            .niveau-option {
                min-width: unset;
            }
        }
    </style>
</head>
<body>
<div class="signup-container">
    <div class="signup-header">
        <h1>INSCRIPTION</h1>
        <p>Rejoignez la communauté gaming</p>
    </div>

    <form th:action="@{/User/saveAccount}" th:object="${user}" method="post" class="signup-form" id="signupForm" novalidate>
        <div class="form-success" id="successMessage">
            Compte créé avec succès ! Bienvenue dans la communauté.
        </div>

        <!-- Section Informations Utilisateur -->
        <div class="form-section">
            <h2 class="section-title">Informations Utilisateur</h2>
            <p class="section-subtitle">Renseignez vos informations personnelles</p>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="nomUtilisateur">Nom d'utilisateur</label>
                    <input type="text" class="form-input" th:field="*{nomUtilisateur}" id="nomUtilisateur" name="nomUtilisateur"
                           placeholder="Votre nom d'utilisateur" required>
                    <div class="form-error" id="nomUtilisateurError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="nomComplet">Nom complet</label>
                    <input type="text" class="form-input" th:field="*{nomComplet}" id="nomComplet" name="nomComplet"
                           placeholder="Votre nom complet" required>
                    <div class="form-error" id="nomCompletError"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Adresse email</label>
                <input type="email" class="form-input" th:field="*{email}" id="email" name="email"
                       placeholder="votre@email.com" required>
                <div class="form-error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="pays">Pays</label>
                <select class="form-select" th:field="*{pays}" id="pays" name="pays" required>
                    <option value="">Sélectionner votre pays</option>
                    <option value="France">France</option>
                    <option value="Belgique">Belgique</option>
                    <option value="Suisse">Suisse</option>
                    <option value="Canada">Canada</option>
                    <option value="Maroc">Maroc</option>
                    <option value="Tunisie">Tunisie</option>
                    <option value="Algérie">Algérie</option>
                    <option value="Sénégal">Sénégal</option>
                    <option value="Côte d'Ivoire">Côte d'Ivoire</option>
                    <option value="Cameroun">Cameroun</option>
                    <option value="Autre">Autre</option>
                </select>
                <div class="form-error" id="paysError"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Mot de passe</label>
                    <div class="password-group">
                        <input type="password" class="form-input" th:field="*{password}" id="password" name="password"
                               placeholder="Votre mot de passe" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">👁️</button>
                    </div>
                    <div class="form-error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmer le mot de passe</label>
                    <div class="password-group">
                        <input type="password" class="form-input" id="confirmPassword" name="confirmPassword"
                               placeholder="Confirmez votre mot de passe" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</button>
                    </div>
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>
            </div>
        </div>

        <!-- Section Informations Joueur -->
        <div class="form-section">
            <h2 class="section-title">Informations Joueur</h2>
            <p class="section-subtitle">Configurez votre profil gaming</p>

            <div class="form-group">
                <label class="form-label">Jeux préférés</label>
                <div class="game-selection" id="gameSelection">
                    <!-- Les jeux seront générés dynamiquement ici avec Thymeleaf -->
                    <div th:each="game : ${allGames}" class="niveau-option" th:onclick="'toggleGame(this)'">
                        <input type="radio"
                               th:id="'game_' + ${game.id}"
                               name="jeuPrefereId"
                               th:value="${game.id}">
                        <label th:for="'game_' + ${game.id}" th:text="${game.name}"></label>
                    </div>
                </div>
                <div class="form-error" id="jeuPrefereError"></div>
            </div>


            <div class="form-group">
                <label class="form-label">Niveau de jeu</label>
                <div class="niveau-options">
                    <div class="niveau-option">
                        <input type="radio" id="debutant" name="niveau" value="DEBUTANT" th:field="*{niveau}" required>
                        <label for="debutant">
                            Débutant
                            <div class="niveau-description">Nouveau dans le gaming compétitif</div>
                        </label>
                    </div>
                    <div class="niveau-option">
                        <input type="radio" id="intermediaire" name="niveau" value="INTERMEDIAIRE" th:field="*{niveau}" required>
                        <label for="intermediaire">
                            Intermédiaire
                            <div class="niveau-description">Expérience modérée en tournois</div>
                        </label>
                    </div>
                    <div class="niveau-option">
                        <input type="radio" id="expert" name="niveau" value="EXPERT" th:field="*{niveau}" required>
                        <label for="expert">
                            Expert
                            <div class="niveau-description">Joueur expérimenté et compétitif</div>
                        </label>
                    </div>
                </div>
                <div class="form-error" id="niveauError"></div>
            </div>
        </div>

        <div class="form-checkbox">
            <input type="checkbox" class="checkbox-input" id="terms" required>
            <label class="checkbox-label" for="terms">
                J'accepte les <a href="#" onclick="showTerms()">conditions d'utilisation</a> et la
                <a href="#" onclick="showPrivacy()">politique de confidentialité</a>
            </label>
        </div>

        <button type="submit" class="signup-button">
            CRÉER MON COMPTE
        </button>

        <div class="login-link">
            Déjà inscrit ? <a href="#" onclick="showLogin()">Se connecter</a>
        </div>
    </form>
</div>

<footer th:replace="~{layout :: footer}"></footer>

    function showError(elementId, message) {
        const errorElement = document.getElementById(elementId);
        errorElement.textContent = message;
        errorElement.style.display = 'block';
    }

    function createAccount(userData) {
        // Simulation de la création du compte
        console.log('Données du compte:', userData);

        // Afficher le message de succès
        document.getElementById('successMessage').style.display = 'block';

        // Réinitialiser le formulaire
        document.getElementById('signupForm').reset();

        // Réinitialiser les sélections de jeux
        document.querySelectorAll('.game-card').forEach(card => {
            card.classList.remove('selected');
        });

        // Faire défiler vers le haut pour voir le message
        document.querySelector('.signup-container').scrollIntoView({ behavior: 'smooth' });

        // Simuler une redirection après 2 secondes

    function showTerms() {
        alert('Conditions d\'utilisation\n\nEn utilisant ce service, vous acceptez de respecter les règles de la communauté gaming et de participer de manière fair-play aux tournois organisés.');

    function showPrivacy() {

    function showLogin() {

    // Animation d'entrée
    window.addEventListener('load', function() {
        const container = document.querySelector('.signup-container');
        container.style.opacity = '0';
        container.style.transform = 'translateY(30px)';

        setTimeout(() => {
            container.style.transition = 'all 0.6s ease';
            container.style.opacity = '1';
            container.style.transform = 'translateY(0)';
